name: Build Dev Snapshot

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows-snapshot:
    name: Windows Snapshot
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend + sidecar + bundle
        run: pnpm tauri build

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veryagent-snapshot-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/veryagent.exe
          retention-days: 7
