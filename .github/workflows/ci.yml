name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck / Lint / Test / Dead-code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint src/

      - name: Unit tests
        run: pnpm test

      - name: Dead-code detection (knip)
        run: pnpm exec knip --production
        continue-on-error: true
        env:
          # knip may report skill-package data files / Rust-referenced deps;
          # don't fail the build on those, just surface them in the log.
          CI: "true"